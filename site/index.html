<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parish Pulse</title>
  <link rel="stylesheet" href="css/style.css?v=20261119120236216507" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-brand">
      <img class="brand-icon" src="parish-pulse-icon.svg?v=20261119120236216507" alt="Parish Pulse logo: white heartbeat in a green hexagon" width="40" height="40">
      <div>
        <h1 id="site-title">Parish Pulse</h1>
        <p id="site-subtitle" class="subtitle"></p>
      </div>
    </div>
    <nav>
      <a href="index.html" class="nav-link active">Dashboard</a>
      <a href="map.html"   class="nav-link">Map</a>
    </nav>
  </div>
</header>

<main class="main">
  <div id="loading" class="loading">Loading dashboard data…</div>
  <div id="content" style="display:none">
    <section id="parish-intro" class="parish-intro" hidden><h2 id="parish-name"></h2><p id="parish-description"></p></section>
    <div id="charts-container"></div>
  </div>
  <div id="error" class="error-msg" style="display:none"></div>
</main>

<footer class="site-footer">
  <div id="footer-inner">
    Powered by <a href="https://github.com/parish-pulse/parish-pulse" target="_blank">Parish Pulse</a>
    &nbsp;·&nbsp; <span id="footer-updated"></span>
  </div>
</footer>

<script>
// ── Data loading ───────────────────────────────────────────────────────────

async function loadJSON(url) {
  const res = await fetch(`${url}?v=20261119120236216507`, {cache: "no-store"});
  if (!res.ok) throw new Error(`HTTP ${res.status} loading ${url}`);
  return res.json();
}

async function init() {
  let cfg, data;
  try {
    [cfg, data] = await Promise.all([
      loadJSON('config.json'),
      loadJSON('dashboard-data.json'),
    ]);
  } catch (e) {
    show('error', `Could not load dashboard data.<br><code>${e.message}</code><br><br>
      Run <code>parish-pulse build</code> then refresh.`);
    hide('loading');
    return;
  }

  applyBranding(cfg, data);
  renderCharts(data);
  hide('loading');
  show('content');
}

// ── Branding ───────────────────────────────────────────────────────────────

function applyBranding(cfg, data) {
  const p  = cfg.parish   || {};
  const db = cfg.dashboard || {};
  const accent = db.accent_colour || '#2D7D46';

  document.documentElement.style.setProperty('--accent', accent);
  document.documentElement.style.setProperty('--accent-light', accent + '18');

  const title = db.title || `${p.name || ''} Parish Pulse`;
  document.title = title;
  setText('site-title',    title);
  setText('parish-name', p.name || '');
  setText('parish-description', p.description || '');
  document.getElementById('parish-intro').hidden = !p.description;
  setText('site-subtitle', db.subtitle || (p.local_authority || ''));
  setText('footer-updated', data.generated ? `Data: ${fmtDate(data.generated)}` : '');
}

// ── Charts ─────────────────────────────────────────────────────────────────

function renderCharts(data) {
  const metrics   = data.metrics || [];
  const container = document.getElementById('charts-container');

  if (metrics.length === 0) {
    container.innerHTML = '<p class="empty">No metrics configured. Add entries to config/metrics.yaml.</p>';
    return;
  }

  // Group by category
  const categories = {};
  for (const m of metrics) {
    const cat = m.category || 'General';
    (categories[cat] = categories[cat] || []).push(m);
  }

  for (const [cat, catMetrics] of Object.entries(categories)) {
    const section = el('section', 'category-section');
    const h2 = el('h2', 'category-title');
    h2.textContent = cat;
    section.appendChild(h2);

    const grid = el('div', 'chart-grid');
    for (const m of catMetrics) {
      grid.appendChild(makeChartCard(m));
    }
    section.appendChild(grid);
    container.appendChild(section);
  }
}

// ── Colour helpers ─────────────────────────────────────────────────────────

function getAccent() {
  return getComputedStyle(document.documentElement)
    .getPropertyValue('--accent').trim() || '#2D7D46';
}

// Generate a palette of n colours anchored to the accent colour.
// Uses evenly-spaced hues so pie slices are visually distinct.
function getPalette(n) {
  const accent = getAccent();
  // Parse accent hex to HSL so we can rotate hue
  const r = parseInt(accent.slice(1,3),16)/255;
  const g = parseInt(accent.slice(3,5),16)/255;
  const b = parseInt(accent.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max) {
      case r: h = ((g-b)/d + (g<b?6:0))/6; break;
      case g: h = ((b-r)/d + 2)/6; break;
      case b: h = ((r-g)/d + 4)/6; break;
    }
  }
  const baseH = h * 360;
  const colours = [];
  for (let i = 0; i < n; i++) {
    const hue = (baseH + (i * 360 / n)) % 360;
    colours.push(`hsl(${Math.round(hue)}, ${Math.round(s*70)}%, ${Math.round(l*55+10)}%)`);
  }
  return colours;
}

// ── Card builder ───────────────────────────────────────────────────────────

function makeChartCard(metric) {
  const card = el('div', 'chart-card');

  // Header
  const header = el('div', 'card-header');
  const titleEl = el('h3', 'card-title');
  titleEl.textContent = metric.label;
  header.appendChild(titleEl);
  if (metric.description) {
    const desc = el('p', 'card-desc');
    desc.textContent = metric.description;
    header.appendChild(desc);
  }
  card.appendChild(header);

  // The build produces display-ready history, not raw CSV rows.
  if (metric.type === 'spatial') {
    const link = el('a', 'card-source');
    link.href = 'map.html';
    link.textContent = 'Explore this indicator on the map';
    card.appendChild(link);
    return card;
  }
  const rows = metric.history || [];
  if (rows.length === 0) {
    const empty = el('p', 'card-error');
    empty.textContent = 'No observations available.';
    card.appendChild(empty);
    return card;
  }
  const chartType = (metric.chart_type || 'line').toLowerCase();
  const valueCol = metric.unit || metric.label;
  const notesCol = 'notes';

  if (chartType !== 'pie') {
    const badge = el('div', 'current-value-wrap');
    const valEl = el('span', 'current-value');
    valEl.textContent = metric.current_value ?? '—';
    const valLabel = el('span', 'current-label');
    valLabel.textContent = valueCol;
    badge.appendChild(valEl);
    badge.appendChild(valLabel);
    card.appendChild(badge);
  }

  // Canvas
  const canvasWrap = el('div', 'canvas-wrap');
  const canvas     = document.createElement('canvas');
  canvasWrap.appendChild(canvas);
  card.appendChild(canvasWrap);

  // Build numeric values array (shared by all types)
  const labels = rows.map(r => r.date || '');
  const values = rows.map(r => {
    const v = r.value;
    return v === null || v === undefined || !Number.isFinite(Number(v)) ? null : Number(v);
  });

  // Tooltip notes callback (shared by line and bar)
  const notesAfterBody = (items) => {
    if (!notesCol) return [];
    const note = rows[items[0].dataIndex]?.[notesCol];
    return note ? [`Note: ${note}`] : [];
  };

  if (chartType === 'pie') {
    canvasWrap.classList.add('pie');
    buildPieChart(canvas, labels, values, valueCol);
  } else if (chartType === 'bar') {
    buildBarChart(canvas, labels, values, valueCol, notesAfterBody);
  } else {
    // Default: line
    buildLineChart(canvas, labels, values, valueCol, notesAfterBody);
  }

  // Source link
  if (metric.source) {
    const src = el('p', 'card-source');
    src.innerHTML = `Source: ${
      metric.source_url
        ? `<a href="${metric.source_url}" target="_blank">${metric.source}</a>`
        : metric.source
    }`;
    card.appendChild(src);
  }

  return card;
}

// ── Chart type builders ────────────────────────────────────────────────────

function buildLineChart(canvas, labels, values, valueCol, notesAfterBody) {
  const accent = getAccent();
  new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label:                valueCol,
        data:                 values,
        borderColor:          accent,
        backgroundColor:      accent + '22',
        tension:              0.3,
        fill:                 true,
        pointRadius:          4,
        pointHoverRadius:     6,
        pointBackgroundColor: accent,
        spanGaps:             true,
      }],
    },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      plugins: {
        legend:  { display: false },
        tooltip: { callbacks: { afterBody: notesAfterBody } },
      },
      scales: {
        x: { ticks: { maxRotation: 45, font: { size: 11 } } },
        y: { beginAtZero: false },
      },
    },
  });
}

function buildBarChart(canvas, labels, values, valueCol, notesAfterBody) {
  const accent = getAccent();
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label:           valueCol,
        data:            values,
        backgroundColor: accent + 'cc',
        borderColor:     accent,
        borderWidth:     1,
        borderRadius:    3,
      }],
    },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      plugins: {
        legend:  { display: false },
        tooltip: { callbacks: { afterBody: notesAfterBody } },
      },
      scales: {
        x: { ticks: { maxRotation: 45, font: { size: 11 } } },
        y: { beginAtZero: true },
      },
    },
  });
}

function buildPieChart(canvas, labels, values, valueCol) {
  // Filter out null/zero slices so the chart is readable
  const paired = labels
    .map((l, i) => ({ label: l, value: values[i] }))
    .filter(d => d.value !== null && d.value > 0);

  const pieLabels = paired.map(d => d.label);
  const pieValues = paired.map(d => d.value);
  const colours   = getPalette(pieLabels.length);

  new Chart(canvas, {
    type: 'pie',
    data: {
      labels: pieLabels,
      datasets: [{
        label:           valueCol,
        data:            pieValues,
        backgroundColor: colours,
        borderColor:     '#fff',
        borderWidth:     2,
        hoverOffset:     6,
      }],
    },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display:  true,
          position: 'bottom',
          labels:   { boxWidth: 14, font: { size: 11 }, padding: 10 },
        },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
              const pct   = total > 0 ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
              return ` ${ctx.parsed} (${pct}%)`;
            },
          },
        },
      },
    },
  });
}

// ── Helpers ────────────────────────────────────────────────────────────────

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}
function setText(id, text) {
  const e = document.getElementById(id);
  if (e) e.textContent = text;
}
function show(id, html) {
  const e = document.getElementById(id);
  if (!e) return;
  e.style.display = '';
  if (html !== undefined) e.innerHTML = html;
}
function hide(id) {
  const e = document.getElementById(id);
  if (e) e.style.display = 'none';
}
function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('en-GB',
      { day: 'numeric', month: 'long', year: 'numeric' });
  } catch { return iso; }
}

init();
</script>
</body>
</html>
